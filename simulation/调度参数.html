<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>调度参数 · 钢厂棒材库区调度系统</title>
<style>
  :root {
    --bg: #050b1a; --bg2: #071021;
    --panel: #0b1730; --panel2: #0e1d3a;
    --line: #16294f; --line2: #1f3a6b;
    --text: #dbe7ff; --dim: #7288b3;
    --cyan: #38bdf8; --teal: #2dd4bf; --amber: #fbbf24;
    --orange: #fb923c; --violet: #a78bfa; --red: #f87171; --green: #34d399;
    --mono: "Cascadia Mono", Consolas, "Courier New", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 70% -10%, #0a1a38 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex; flex-direction: column; min-width: 960px;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    border-bottom: 1px solid var(--line); background: rgba(8, 18, 38, .7); flex: none;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .logo {
    width: 30px; height: 30px; border-radius: 8px; flex: none;
    background: linear-gradient(135deg, #0ea5e9, #1d4ed8);
    display: flex; align-items: center; justify-content: center; font-size: 15px;
    box-shadow: 0 0 14px rgba(56, 189, 248, .35);
  }
  .brand h1 { font-size: 14px; font-weight: 700; letter-spacing: .5px; }
  nav { display: flex; gap: 6px; margin-left: 10px; }
  nav a {
    color: var(--dim); text-decoration: none; font-size: 12px;
    border: 1px solid var(--line2); border-radius: 6px; padding: 4px 10px;
    transition: all .15s; background: var(--panel2);
  }
  nav a:hover { border-color: var(--cyan); color: #fff; }
  nav a.on { background: var(--cyan); color: #04121f; font-weight: 700; border-color: var(--cyan); }
  .actions { margin-left: auto; display: flex; gap: 6px; }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line2);
    border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer;
    font-family: inherit; transition: all .15s;
  }
  button:hover { border-color: var(--cyan); color: #fff; box-shadow: 0 0 10px rgba(56,189,248,.2); }
  button:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
  button.primary { border-color: rgba(56, 189, 248, .5); color: var(--cyan); }
  main { flex: 1; overflow-y: auto; padding: 18px 16px 40px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  .desc { font-size: 12px; color: var(--dim); line-height: 1.7; margin-bottom: 14px; }
  .desc code { font-family: var(--mono); color: var(--cyan); }
  section {
    background: rgba(11, 23, 48, .75); border: 1px solid var(--line);
    border-radius: 10px; padding: 14px 16px; margin-bottom: 12px;
  }
  section h2 { font-size: 14px; font-weight: 700; }
  section .sdesc { font-size: 11px; color: var(--dim); margin: 3px 0 6px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 7px 0; border-top: 1px solid rgba(22, 41, 79, .6); }
  .row .lab { width: 150px; flex: none; font-size: 12.5px; color: var(--text); }
  .row input[type=range] { flex: 1; accent-color: var(--cyan); }
  .row .num { display: flex; align-items: center; gap: 5px; flex: none; }
  .row input[type=number] {
    width: 76px; background: rgba(5, 11, 26, .8); border: 1px solid var(--line2);
    border-radius: 6px; color: var(--text); font-family: var(--mono); font-size: 12.5px;
    padding: 3px 7px; text-align: right; outline: none;
  }
  .row input[type=number]:focus { border-color: var(--cyan); }
  .row .unit { font-size: 11px; color: var(--dim); width: 38px; }
  .msg { border-radius: 8px; padding: 8px 12px; font-size: 12.5px; margin-bottom: 12px; border: 1px solid; }
  .msg.ok { border-color: rgba(52, 211, 153, .4); background: rgba(52, 211, 153, .08); color: var(--green); }
  .msg.err { border-color: rgba(248, 113, 113, .4); background: rgba(248, 113, 113, .08); color: var(--red); }
  .msg.err button { margin-left: 6px; color: var(--cyan); border: none; background: none; text-decoration: underline; padding: 0; }
  .hint { text-align: center; color: var(--dim); font-size: 12.5px; padding: 60px 0; }
  .spin { display: inline-block; animation: r 1s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">⚙</div>
    <div><h1>调度参数</h1></div>
  </div>
  <nav>
    <a href="/">🗺 仿真沙盘</a>
    <a href="/inbound">🚚 进厂确认</a>
    <a href="/params" class="on">⚙ 调度参数</a>
  </nav>
  <div class="actions">
    <button id="btnReset">↺ 恢复默认</button>
    <button id="btnSave" class="primary">✓ 保存修改</button>
  </div>
</header>
<main><div class="wrap" id="app"><p class="hint"><span class="spin">◌</span> 正在从数据库加载调度参数…</p></div></main>

<script>
'use strict';
// 库存数据库 API；本地多实例调试可用 ?api=http://127.0.0.1:3101 覆盖
const DB_API = new URLSearchParams(location.search).get('api') || 'http://127.0.0.1:3001';
const app = document.getElementById('app');
const btnSave = document.getElementById('btnSave');
const btnReset = document.getElementById('btnReset');

let schema = [];            // [{sec, secLabel, desc, defs:[{key,label,min,max,step,unit,def}]}]
let values = {};            // 当前编辑值 { sec: { key: value } }
let saved = {};             // 已保存值（脏判断基准）

const defaultsOf = sch => Object.fromEntries(
  sch.map(s => [s.sec, Object.fromEntries(s.defs.map(d => [d.key, d.def]))]));

const isDirty = () => JSON.stringify(values) !== JSON.stringify(saved);

function setVal(sec, key, v) {
  const d = schema.find(s => s.sec === sec).defs.find(x => x.key === key);
  v = Math.min(d.max, Math.max(d.min, Number.isFinite(v) ? v : d.min));
  values[sec][key] = v;
  document.querySelectorAll(`[data-sec="${sec}"][data-key="${key}"]`).forEach(el => { el.value = v; });
  refreshButtons();
}

function refreshButtons() {
  const dirty = isDirty();
  btnSave.disabled = !dirty;
  btnSave.textContent = dirty ? '✓ 保存修改' : '已保存';
}

function renderMsg(ok, text, retry) {
  const old = document.querySelector('.msg');
  if (old) old.remove();
  if (!text) return;
  const div = document.createElement('div');
  div.className = 'msg ' + (ok ? 'ok' : 'err');
  div.textContent = text;
  if (retry) {
    const b = document.createElement('button');
    b.textContent = '重试';
    b.onclick = load;
    div.appendChild(b);
  }
  app.prepend(div);
}

function render() {
  app.innerHTML = '';
  const desc = document.createElement('p');
  desc.className = 'desc';
  desc.innerHTML = '调度规划系统参数，持久化在本地库存数据库（' + DB_API + '），与仿真沙盘共用同一份：' +
    '进厂车按规格整车配载、同车同规格归并同一垛位，垛满后才按「归堆策略权重」另荐新垛；' +
    '「进厂确认」页的人工调整也会自动微调归堆权重。';
  app.appendChild(desc);
  for (const s of schema) {
    const sec = document.createElement('section');
    const h2 = document.createElement('h2');
    h2.textContent = s.secLabel;
    const sd = document.createElement('p');
    sd.className = 'sdesc';
    sd.textContent = s.desc || '';
    sec.append(h2, sd);
    for (const d of s.defs) {
      const row = document.createElement('div');
      row.className = 'row';
      const lab = document.createElement('span');
      lab.className = 'lab';
      lab.textContent = d.label;
      const range = document.createElement('input');
      Object.assign(range, { type: 'range', min: d.min, max: d.max, step: d.step, value: values[s.sec][d.key] });
      range.dataset.sec = s.sec; range.dataset.key = d.key;
      range.oninput = e => setVal(s.sec, d.key, Number(e.target.value));
      const num = document.createElement('div');
      num.className = 'num';
      const number = document.createElement('input');
      Object.assign(number, { type: 'number', min: d.min, max: d.max, step: d.step, value: values[s.sec][d.key] });
      number.dataset.sec = s.sec; number.dataset.key = d.key;
      number.onchange = e => setVal(s.sec, d.key, Number(e.target.value));
      const unit = document.createElement('span');
      unit.className = 'unit';
      unit.textContent = d.unit;
      num.append(number, unit);
      row.append(lab, range, num);
      sec.appendChild(row);
    }
    app.appendChild(sec);
  }
  refreshButtons();
}

async function load() {
  app.innerHTML = '<p class="hint"><span class="spin">◌</span> 正在从数据库加载调度参数…</p>';
  try {
    const res = await fetch(DB_API + '/api/params');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const r = await res.json();
    schema = r.schema;
    values = r.values;
    saved = JSON.parse(JSON.stringify(r.values));
    render();
  } catch {
    app.innerHTML = '';
    renderMsg(false, '调度参数加载失败：数据库服务未启动（请先执行 npm run db:serve 或 npm run sim）。', true);
  }
}

btnReset.onclick = () => { values = defaultsOf(schema); render(); };
btnSave.onclick = async () => {
  btnSave.disabled = true;
  btnSave.textContent = '保存中…';
  try {
    const res = await fetch(DB_API + '/api/params', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ values }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const r = await res.json();
    values = r.values;
    saved = JSON.parse(JSON.stringify(r.values));
    render();
    renderMsg(true, '已保存到数据库。仿真沙盘下次启动时自动加载；已打开的沙盘在「⚙ 设备参数」中调整也会同步回这里。');
  } catch {
    renderMsg(false, '保存失败：数据库服务不可达（请先执行 npm run db:serve 或 npm run sim）。');
    refreshButtons();
  }
};

load();
</script>
</body>
</html>
