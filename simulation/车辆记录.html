<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>车辆记录 · 钢厂棒材库区调度系统</title>
<style>
  :root {
    --bg: #050b1a; --bg2: #071021;
    --panel: #0b1730; --panel2: #0e1d3a;
    --line: #16294f; --line2: #1f3a6b;
    --text: #dbe7ff; --dim: #7288b3;
    --cyan: #38bdf8; --teal: #2dd4bf; --amber: #fbbf24;
    --orange: #fb923c; --violet: #a78bfa; --red: #f87171; --green: #34d399;
    --mono: "Cascadia Mono", Consolas, "Courier New", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 70% -10%, #0a1a38 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    display: flex; flex-direction: column; min-width: 1180px;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    border-bottom: 1px solid var(--line); background: rgba(8, 18, 38, .7); flex: none;
  }
  .brand { display: flex; align-items: center; gap: 8px; }
  .logo {
    width: 30px; height: 30px; border-radius: 8px; flex: none;
    background: linear-gradient(135deg, #0ea5e9, #1d4ed8);
    display: flex; align-items: center; justify-content: center; font-size: 15px;
    box-shadow: 0 0 14px rgba(56, 189, 248, .35);
  }
  .brand h1 { font-size: 14px; font-weight: 700; letter-spacing: .5px; }
  nav { display: flex; gap: 6px; margin-left: 10px; }
  nav a {
    color: var(--dim); text-decoration: none; font-size: 12px;
    border: 1px solid var(--line2); border-radius: 6px; padding: 4px 10px;
    transition: all .15s; background: var(--panel2);
  }
  nav a:hover { border-color: var(--cyan); color: #fff; }
  nav a.on { background: var(--cyan); color: #04121f; font-weight: 700; border-color: var(--cyan); }
  .actions { margin-left: auto; display: flex; gap: 6px; }
  button {
    background: var(--panel2); color: var(--text); border: 1px solid var(--line2);
    border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer;
    font-family: inherit; transition: all .15s;
  }
  button:hover { border-color: var(--cyan); color: #fff; box-shadow: 0 0 10px rgba(56,189,248,.2); }
  button:disabled { opacity: .4; cursor: not-allowed; box-shadow: none; }
  button.primary { border-color: rgba(56, 189, 248, .5); color: var(--cyan); }
  main { flex: 1; overflow-y: auto; padding: 16px; }
  .wrap { max-width: 1400px; margin: 0 auto; }
  .desc { font-size: 12px; color: var(--dim); line-height: 1.7; margin-bottom: 12px; max-width: 900px; }
  .filters {
    display: flex; gap: 12px; margin-bottom: 16px; align-items: center; flex-wrap: wrap;
  }
  .filter-group {
    display: flex; align-items: center; gap: 6px;
  }
  .filter-group label {
    font-size: 12px; color: var(--dim);
  }
  .filter-group select, .filter-group input {
    background: rgba(5, 11, 26, .8); border: 1px solid var(--line2);
    border-radius: 6px; color: var(--text); font-size: 12px; padding: 6px 10px;
    font-family: inherit;
  }
  .filter-group select:focus, .filter-group input:focus {
    border-color: var(--cyan); outline: none;
  }
  .stats {
    display: flex; gap: 12px; margin-bottom: 16px;
  }
  .stat-card {
    background: rgba(11, 23, 48, .75); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 16px; flex: 1; text-align: center;
  }
  .stat-card .value {
    font-size: 24px; font-family: var(--mono); font-weight: 700; color: var(--cyan);
  }
  .stat-card .label {
    font-size: 11px; color: var(--dim); margin-top: 4px;
  }
  table {
    width: 100%; border-collapse: collapse; margin-top: 12px;
  }
  th {
    background: rgba(14, 29, 58, .8); border: 1px solid var(--line); padding: 10px 12px;
    font-size: 12px; font-weight: 600; text-align: left; color: var(--text);
  }
  td {
    border: 1px solid var(--line); padding: 10px 12px; font-size: 12px;
    background: rgba(11, 23, 48, .5);
  }
  tr:hover td {
    background: rgba(14, 29, 58, .7);
  }
  .plate-cell {
    font-family: var(--mono); font-weight: 600; color: var(--cyan);
  }
  .time-cell {
    font-family: var(--mono); font-size: 11px;
  }
  .status {
    display: inline-block; font-size: 11px; border-radius: 4px; padding: 2px 8px;
  }
  .status.pending {
    background: rgba(251, 191, 36, .1); border: 1px solid rgba(251, 191, 36, .3); color: var(--amber);
  }
  .status.confirmed {
    background: rgba(52, 211, 153, .1); border: 1px solid rgba(52, 211, 153, .3); color: var(--green);
  }
  .status.outbound {
    background: rgba(56, 189, 248, .1); border: 1px solid rgba(56, 189, 248, .3); color: var(--cyan);
  }
  .loads-summary {
    display: flex; gap: 6px; flex-wrap: wrap;
  }
  .load-chip {
    font-size: 11px; border: 1px solid var(--line2); background: rgba(5, 11, 26, .7);
    border-radius: 4px; padding: 2px 6px; display: flex; align-items: center; gap: 4px;
  }
  .load-chip .spec {
    color: var(--text);
  }
  .load-chip .qty {
    color: var(--dim); font-family: var(--mono);
  }
  .empty {
    border: 1px dashed var(--line2); border-radius: 10px; text-align: center;
    padding: 60px 0; color: var(--dim); font-size: 12.5px;
  }
  .empty .big { font-size: 30px; margin-bottom: 8px; }
  .spin { display: inline-block; animation: r 1s linear infinite; color: var(--cyan); }
  @keyframes r { to { transform: rotate(360deg); } }
  .msg { border-radius: 8px; padding: 8px 12px; font-size: 12.5px; margin-bottom: 12px; border: 1px solid; }
  .msg.ok { border-color: rgba(52, 211, 153, .4); background: rgba(52, 211, 153, .08); color: var(--green); }
  .msg.err { border-color: rgba(248, 113, 113, .4); background: rgba(248, 113, 113, .08); color: var(--red); }
  .details-btn {
    background: none; border: 1px solid var(--line2); color: var(--dim);
    font-size: 11px; padding: 2px 6px; border-radius: 4px; cursor: pointer;
  }
  .details-btn:hover {
    border-color: var(--cyan); color: var(--cyan);
  }
  .modal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, .6); z-index: 1000; align-items: center; justify-content: center;
  }
  .modal.show { display: flex; }
  .modal-content {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 20px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto;
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
  }
  .modal-header h2 {
    font-size: 16px; color: var(--text);
  }
  .modal-close {
    background: none; border: none; color: var(--dim); font-size: 18px; cursor: pointer;
  }
  .modal-close:hover { color: var(--text); }
  .detail-row {
    display: flex; justify-content: space-between; padding: 8px 0;
    border-bottom: 1px solid rgba(22, 41, 79, .6);
  }
  .detail-label {
    font-size: 12px; color: var(--dim);
  }
  .detail-value {
    font-size: 12px; color: var(--text); font-family: var(--mono);
  }
  .loads-table {
    width: 100%; margin-top: 12px; border-collapse: collapse;
  }
  .loads-table th {
    background: rgba(14, 29, 58, .6); padding: 8px; font-size: 11px;
  }
  .loads-table td {
    padding: 8px; font-size: 11px; border: 1px solid var(--line);
  }
</style>
</head>
<body>
<script>/* 页内工作台嵌入模式（?embed=1）：隐藏本页导航，沙盘顶部导航已提供页内切换 */
if (new URLSearchParams(location.search).get('embed') === '1') document.documentElement.classList.add('embed');</script>
<style>html.embed header nav { display: none; }</style>
<header>
  <div class="brand">
    <div class="logo">🚚</div>
    <div><h1>车辆记录 · 物流信息</h1></div>
  </div>
  <nav title="新标签打开，不打断各页面状态">
    <a href="/" target="_blank">🗺 仿真沙盘</a>
    <a href="/inbound" target="_blank">🚚 进厂确认</a>
    <a class="on">📋 车辆记录</a>
    <a href="/params" target="_blank">⚙ 调度参数</a>
    <a href="/runs" target="_blank">📊 仿真场次</a>
  </nav>
  <div class="actions">
    <button id="btnRefresh" class="primary">↻ 刷新</button>
    <button id="btnExport">导出 CSV</button>
  </div>
</header>
<main>
  <div class="wrap">
    <p class="desc">
      物流车辆进出场记录：查看所有进厂车辆的识别信息、运单详情、垛位分配及装卸状态。
      支持按时间、车牌、状态筛选，点击详情查看完整运送信息。
    </p>
    <div id="msg"></div>
    
    <div class="filters">
      <div class="filter-group">
        <label>状态：</label>
        <select id="filterStatus">
          <option value="">全部</option>
          <option value="pending">待确认</option>
          <option value="confirmed">已确认</option>
        </select>
      </div>
      <div class="filter-group">
        <label>车牌：</label>
        <input type="text" id="filterPlate" placeholder="输入车牌号...">
      </div>
      <div class="filter-group">
        <label>时间：</label>
        <select id="filterTime">
          <option value="">全部时间</option>
          <option value="today">今天</option>
          <option value="week">最近一周</option>
          <option value="month">最近一月</option>
        </select>
      </div>
      <button id="btnSearch" style="margin-left: auto;">搜索</button>
      <button id="btnReset">重置</button>
    </div>

    <div class="stats" id="stats">
      <div class="stat-card">
        <div class="value" id="totalVehicles">-</div>
        <div class="label">总车辆数</div>
      </div>
      <div class="stat-card">
        <div class="value" id="todayVehicles">-</div>
        <div class="label">今日进厂</div>
      </div>
      <div class="stat-card">
        <div class="value" id="pendingVehicles">-</div>
        <div class="label">待确认</div>
      </div>
      <div class="stat-card">
        <div class="value" id="totalLoads">-</div>
        <div class="label">总吊数</div>
      </div>
    </div>

    <div id="vehicles">
      <div class="empty">
        <div class="big">🚚</div>
        <p>正在加载车辆记录...</p>
      </div>
    </div>
  </div>
</main>

<div class="modal" id="detailModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle">车辆详情</h2>
      <button class="modal-close" id="modalClose">&times;</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<script>
'use strict';
const DB_API = new URLSearchParams(location.search).get('api') || 'http://127.0.0.1:3001';

const SPEC_COLORS = {
  '螺纹钢 Φ20': '#f59e0b', '螺纹钢 Φ25': '#fb923c',
  '圆钢 Φ50': '#38bdf8', '圆钢 Φ60': '#7dd3fc', '方钢 40×40': '#a78bfa',
};
const specColor = s => SPEC_COLORS[s] || '#94a3b8';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtFull = iso => iso ? new Date(iso).toLocaleString('zh-CN', { hour12: false, month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) : '-';
const fmtClock = iso => iso ? new Date(iso).toLocaleTimeString('zh-CN', { hour12: false, hour: '2-digit', minute: '2-digit' }) : '-';

const state = { vehicles: [], filtered: [], stats: null, loading: false };

const $vehicles = document.getElementById('vehicles');
const $msg = document.getElementById('msg');
const $modal = document.getElementById('detailModal');
const $modalTitle = document.getElementById('modalTitle');
const $modalBody = document.getElementById('modalBody');
const btnRefresh = document.getElementById('btnRefresh');
const btnExport = document.getElementById('btnExport');
const btnSearch = document.getElementById('btnSearch');
const btnReset = document.getElementById('btnReset');
const filterStatus = document.getElementById('filterStatus');
const filterPlate = document.getElementById('filterPlate');
const filterTime = document.getElementById('filterTime');

async function api(path, opts, errLabel) {
  const res = await fetch(DB_API + path, opts);
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error((data && data.error) || (errLabel + '：HTTP ' + res.status));
  return data;
}

function showMsg(ok, text, retry) {
  $msg.innerHTML = '';
  if (!text) return;
  const div = document.createElement('div');
  div.className = 'msg ' + (ok ? 'ok' : 'err');
  div.textContent = text;
  if (retry) {
    const b = document.createElement('button');
    b.textContent = '重试';
    b.onclick = load;
    div.appendChild(b);
  }
  $msg.appendChild(div);
}

function updateStats() {
  const total = state.vehicles.length;
  const today = new Date().toISOString().slice(0, 10);
  const todayCount = state.vehicles.filter(v => v.arriveTime && v.arriveTime.startsWith(today)).length;
  const pending = state.vehicles.filter(v => v.state === 'pending').length;
  const totalLoads = state.vehicles.reduce((sum, v) => sum + (v.loads ? v.loads.reduce((s, l) => s + l.bundles, 0) : 0), 0);
  
  document.getElementById('totalVehicles').textContent = total;
  document.getElementById('todayVehicles').textContent = todayCount;
  document.getElementById('pendingVehicles').textContent = pending;
  document.getElementById('totalLoads').textContent = totalLoads;
}

function filterVehicles() {
  let filtered = [...state.vehicles];
  const status = filterStatus.value;
  const plate = filterPlate.value.trim().toUpperCase();
  const time = filterTime.value;
  
  if (status) {
    filtered = filtered.filter(v => v.state === status);
  }
  if (plate) {
    filtered = filtered.filter(v => v.plate.toUpperCase().includes(plate));
  }
  if (time) {
    const now = new Date();
    const today = now.toISOString().slice(0, 10);
    const weekAgo = new Date(now - 7 * 24 * 60 * 60 * 1000).toISOString();
    const monthAgo = new Date(now - 30 * 24 * 60 * 60 * 1000).toISOString();
    
    if (time === 'today') {
      filtered = filtered.filter(v => v.arriveTime && v.arriveTime.startsWith(today));
    } else if (time === 'week') {
      filtered = filtered.filter(v => v.arriveTime && v.arriveTime >= weekAgo);
    } else if (time === 'month') {
      filtered = filtered.filter(v => v.arriveTime && v.arriveTime >= monthAgo);
    }
  }
  
  state.filtered = filtered;
  renderVehicles();
}

function renderVehicles() {
  if (state.loading) {
    $vehicles.innerHTML = '<div class="empty"><div class="big">⏳</div><p>正在加载...</p></div>';
    return;
  }
  
  if (!state.filtered.length) {
    $vehicles.innerHTML = '<div class="empty"><div class="big">🚚</div><p>暂无车辆记录</p></div>';
    return;
  }
  
  let html = `<table>
    <thead>
      <tr>
        <th>车牌号</th>
        <th>运单号</th>
        <th>钢厂</th>
        <th>到达时间</th>
        <th>状态</th>
        <th>运送信息</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody>`;
  
  for (const v of state.filtered) {
    const statusClass = v.state === 'pending' ? 'pending' : 'confirmed';
    const statusText = v.state === 'pending' ? '待确认' : '已确认';
    const loadsSummary = v.loads ? v.loads.map(l => 
      `<span class="load-chip"><span class="spec">${esc(l.spec)}</span><span class="qty">${l.bundles}吊</span></span>`
    ).join('') : '<span class="load-chip">无配载</span>';
    
    html += `<tr>
      <td class="plate-cell">${esc(v.plate)}</td>
      <td>${esc(v.waybill)}</td>
      <td>${esc(v.mill)}</td>
      <td class="time-cell">${fmtFull(v.arriveTime)}</td>
      <td><span class="status ${statusClass}">${statusText}</span></td>
      <td><div class="loads-summary">${loadsSummary}</div></td>
      <td><button class="details-btn" data-id="${v.id}">详情</button></td>
    </tr>`;
  }
  
  html += '</tbody></table>';
  $vehicles.innerHTML = html;
  
  // 绑定详情按钮
  $vehicles.querySelectorAll('.details-btn').forEach(btn => {
    btn.addEventListener('click', () => showDetail(+btn.dataset.id));
  });
}

function showDetail(vehicleId) {
  const v = state.vehicles.find(v => v.id === vehicleId);
  if (!v) return;
  
  $modalTitle.textContent = `车辆详情 - ${v.plate}`;
  
  let html = `
    <div class="detail-row">
      <span class="detail-label">车牌号</span>
      <span class="detail-value">${esc(v.plate)}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">运单号</span>
      <span class="detail-value">${esc(v.waybill)}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">钢厂</span>
      <span class="detail-value">${esc(v.mill)}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">到达时间</span>
      <span class="detail-value">${fmtFull(v.arriveTime)}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">确认时间</span>
      <span class="detail-value">${v.confirmedTime ? fmtFull(v.confirmedTime) : '未确认'}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">状态</span>
      <span class="detail-value">${v.state === 'pending' ? '待确认' : '已确认'}</span>
    </div>`;
  
  if (v.loads && v.loads.length) {
    html += `<h3 style="margin-top: 16px; font-size: 13px; color: var(--cyan);">运送详情</h3>
      <table class="loads-table">
        <thead>
          <tr>
            <th>规格</th>
            <th>吊数</th>
            <th>推荐垛位</th>
            <th>最终垛位</th>
            <th>推荐评分</th>
          </tr>
        </thead>
        <tbody>`;
    
    for (const l of v.loads) {
      const recSlot = `${l.recCode}垛${l.recStackNo}`;
      const finalSlot = l.adjusted && l.code ? `${l.code}垛${l.stackNo}` : recSlot;
      const isAdjusted = l.adjusted;
      
      html += `<tr>
        <td style="color: ${specColor(l.spec)}">${esc(l.spec)}</td>
        <td style="font-family: var(--mono)">${l.bundles}</td>
        <td>${recSlot}</td>
        <td style="color: ${isAdjusted ? 'var(--amber)' : 'var(--text)'}">${finalSlot}${isAdjusted ? ' (调整)' : ''}</td>
        <td style="font-family: var(--mono)">${l.recScore.toFixed(1)}</td>
      </tr>`;
    }
    
    html += '</tbody></table>';
  }
  
  $modalBody.innerHTML = html;
  $modal.classList.add('show');
}

async function load() {
  if (state.loading) return;
  state.loading = true;
  renderVehicles();
  showMsg(false, '');

  try {
    const data = await api('/api/vehicles?limit=100', {}, '加载车辆记录失败');
    state.vehicles = data.vehicles || [];
    state.filtered = [...state.vehicles];
    state.loading = false;
    updateStats();
    renderVehicles();
    showMsg(true, `已加载 ${state.vehicles.length} 条车辆记录`);
    setTimeout(() => showMsg(false, ''), 2000);
  } catch (e) {
    state.loading = false;
    showMsg(false, e.message, true);
    renderVehicles();
  }
}

function exportCSV() {
  if (!state.filtered.length) {
    alert('没有数据可导出');
    return;
  }
  
  const headers = ['车牌号', '运单号', '钢厂', '到达时间', '确认时间', '状态', '运送规格', '总吊数'];
  const rows = state.filtered.map(v => {
    const specs = v.loads ? [...new Set(v.loads.map(l => l.spec))].join('; ') : '';
    const totalBundles = v.loads ? v.loads.reduce((s, l) => s + l.bundles, 0) : 0;
    return [
      v.plate,
      v.waybill,
      v.mill,
      v.arriveTime,
      v.confirmedTime || '',
      v.state === 'pending' ? '待确认' : '已确认',
      specs,
      totalBundles
    ].map(field => `"${String(field).replace(/"/g, '""')}"`).join(',');
  });
  
  const csv = [headers.join(','), ...rows].join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `车辆记录_${new Date().toISOString().slice(0, 10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// 事件绑定
btnRefresh.addEventListener('click', load);
btnExport.addEventListener('click', exportCSV);
btnSearch.addEventListener('click', filterVehicles);
btnReset.addEventListener('click', () => {
  filterStatus.value = '';
  filterPlate.value = '';
  filterTime.value = '';
  state.filtered = [...state.vehicles];
  renderVehicles();
});
document.getElementById('modalClose').addEventListener('click', () => {
  $modal.classList.remove('show');
});
$modal.addEventListener('click', (e) => {
  if (e.target === $modal) $modal.classList.remove('show');
});

// 初始加载
load();
</script>
